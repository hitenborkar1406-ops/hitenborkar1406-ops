<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="225" viewBox="0 0 1200 225" role="img" aria-label="Programming language distribution"><title>Programming language distribution</title><defs><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.enter{animation:rise .8s ease both}.pulse{animation:pulse 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="225" rx="22" fill="#17191D" stroke="#4A4640"/><text x="42" y="43" fill="#F0E8DA" font-size="25" class="serif">The code behind the work</text><text x="42" y="69" fill="#BEB09A" font-size="11" letter-spacing="1">LANGUAGE DISTRIBUTION · FEATURED PUBLIC REPOSITORIES</text><text x="42" y="125" fill="#BEB09A" font-size="14">Language data will appear after the first repository sync.</text><text x="900" y="120" fill="#63D6E2" font-size="32" class="serif">0</text><text x="900" y="141" fill="#BEB09A" font-size="11">LANGUAGES DETECTED</text></svg>