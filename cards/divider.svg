<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-label="Divider"><title>Divider</title><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7D8BB"/><stop offset="1" stop-color="#D2BA94"/></linearGradient><linearGradient id="olive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C704A"/><stop offset="1" stop-color="#4C4F31"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE266"/><stop offset="1" stop-color="#F5C500"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B5E3C"/><stop offset="1" stop-color="#FFD21F"/></linearGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.75}}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}.sweep{transform-box:fill-box;transform-origin:0 50%;animation:sweep .8s cubic-bezier(.2,.7,.2,1) both}.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s ease-out both}.fade{animation:fade .5s ease-out both}.pulse{animation:pulse 1.8s ease-in-out infinite}.breathe{animation:breathe 4.5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g"><stop offset="0" stop-color="#D8C3A0" stop-opacity="0"/><stop offset=".25" stop-color="#D8C3A0"/><stop offset=".6" stop-color="#5B5E3C"/><stop offset=".85" stop-color="#FFD21F"/><stop offset="1" stop-color="#FFD21F" stop-opacity="0"/></linearGradient></defs><rect y="2" width="1200" height="2" rx="1" fill="url(#g)"/></svg>