<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Contribution level 2"><title>Contribution level 2</title><defs><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{from{opacity:0}to{opacity:1}}.portrait-row{opacity:1}.enter{animation:rise .8s ease both}.pulse{animation:pulse 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs><rect width="16" height="16" rx="4" fill="#B6D7EB"/></svg>