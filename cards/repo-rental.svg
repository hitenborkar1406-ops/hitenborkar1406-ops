<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="Vehicle Rental System"><title>Vehicle Rental System</title><defs><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{from{opacity:0}to{opacity:1}}.portrait-row{opacity:1}.enter{animation:rise .8s ease both}.pulse{animation:pulse 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40432F"/><stop offset="1" stop-color="#353827"/></linearGradient></defs><rect width="560" height="170" rx="18" fill="url(#card)" stroke="#6C7050"/><rect x="0" y="22" width="3" height="126" rx="2" fill="#FFD21F"/><text x="28" y="37" fill="#FFD21F" font-size="10">FEATURED PROJECT / 04</text><text x="28" y="72" fill="#D8C3A0" font-size="25" class="serif">Vehicle Rental System</text><text x="28" y="98" fill="#D8C3A0" font-size="12">Flask app with booking rules and automated tests.</text><text x="28" y="125" fill="#FFD21F" font-size="11">Python · Flask · SQLite · pytest</text><text x="28" y="151" fill="#D8C3A0" font-size="10">★ 1   FORKS 0   UPDATED Nov 2026</text></svg>