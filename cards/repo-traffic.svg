<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="Smart Traffic Management"><title>Smart Traffic Management</title><defs><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes reveal{from{opacity:0}to{opacity:1}}.portrait-row{opacity:1}.enter{animation:rise .8s ease both}.pulse{animation:pulse 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style></defs><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292A25"/><stop offset="1" stop-color="#20211E"/></linearGradient></defs><rect width="560" height="170" rx="18" fill="url(#card)" stroke="#3A3B36"/><rect x="0" y="22" width="3" height="126" rx="2" fill="#FFC928"/><text x="28" y="37" fill="#FFC928" font-size="10">FEATURED PROJECT / 01</text><text x="28" y="72" fill="#F2F4F1" font-size="25" class="serif">Smart Traffic Management</text><text x="28" y="98" fill="#B8B9B1" font-size="12">Predictive congestion and alternate routing for Nagpur.</text><text x="28" y="125" fill="#FFC928" font-size="11">React · FastAPI · XGBoost · Leaflet</text><text x="28" y="151" fill="#B8B9B1" font-size="10">★ 0   FORKS 0   UPDATED —</text></svg>