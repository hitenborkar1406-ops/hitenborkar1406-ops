name: Refresh Profile Cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-profile-cards.yml"
      - "scripts/render_readme_cards.py"
      - "README.md"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Fetch contribution calendar and repository metrics
        env:
          GH_USERNAME: hitenborkar1406-ops
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.request

          username = os.environ["GH_USERNAME"]
          contribution_url = f"https://github-contributions-api.jogruber.de/v4/{username}?y=last"
          request = urllib.request.Request(
              contribution_url,
              headers={"User-Agent": "profile-readme-renderer", "Accept": "application/json"}
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              payload = json.load(response)

          raw_days = payload.get("contributions", [])
          days = [
              {"date": day["date"], "contributionCount": int(day.get("count", 0))}
              for day in raw_days if day.get("date")
          ]
          days.sort(key=lambda day: day["date"])
          if len(days) < 300:
              raise SystemExit(f"Contribution API returned only {len(days)} days; expected at least 300.")

          total_data = payload.get("total", {})
          total = int(total_data.get("lastYear", sum(day["contributionCount"] for day in days)))
          weeks = [{"contributionDays": days[i:i+7]} for i in range(0, len(days), 7)]
          with open("data/contributions.json", "w", encoding="utf-8") as output:
              json.dump({"total": total, "weeks": weeks}, output, indent=2)
          print(f"Fetched {len(days)} days and {total} contributions for {username}.")

          headers = {"User-Agent": "profile-readme-renderer", "Accept": "application/vnd.github+json"}

          def github_api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repository_names = [
              "SMART_TRAFFIC_MANAGEMENT_SYSTEM", "IPL_CRUNCH",
              "PROMPTWARS", "VEHICLE-RENTAL-SYSTEM"
          ]
          repositories = {}
          for name in repository_names:
              base = f"https://api.github.com/repos/{username}/{name}"
              try:
                  metadata = github_api(base)
                  try:
                      metadata["languages"] = github_api(base + "/languages")
                  except Exception as error:
                      print(f"Language breakdown unavailable for {name}: {error}")
                      metadata["languages"] = {}
                  repositories[name] = metadata
                  print(
                      f"{name}: {metadata.get('stargazers_count', 0)} stars, "
                      f"{metadata.get('forks_count', 0)} forks"
                  )
              except Exception as error:
                  print(f"Repository metrics unavailable for {name}: {error}")

          with open("data/repos.json", "w", encoding="utf-8") as output:
              json.dump(repositories, output, indent=2)
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG analytics cards
        run: python scripts/render_readme_cards.py
      - name: Commit refreshed cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json data/repos.json
          git diff --cached --quiet || git commit -m "chore: refresh profile analytics"
          git push
