name: Refresh profile cards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: hitenborkar1406-ops
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.request
          q = """query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}"""
          payload=json.dumps({"query":q,"variables":{"login":os.environ["GH_USERNAME"]}}).encode()
          req=urllib.request.Request("https://api.github.com/graphql",data=payload,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req) as r: result=json.load(r)
          if result.get("errors") or not result.get("data",{}).get("user"): raise SystemExit("Contribution query failed: "+json.dumps(result.get("errors")))
          cal=result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          with open("data/contributions.json","w") as f: json.dump({"total":cal["totalContributions"],"weeks":cal["weeks"]},f,indent=2)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG cards
        run: python scripts/render_readme_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh animated profile cards"
          git push
